name: quiet-mediation
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-quiet-mediation}-db
    environment:
      MYSQL_DATABASE: quiet
      MYSQL_USER: quiet
      MYSQL_PASSWORD: quiet-demo
      MYSQL_ROOT_PASSWORD: quiet-root
    command: ["--transaction-isolation=READ-COMMITTED"]
    ports: ["${DB_PORT:-17739}:3306"]
    volumes: ["db_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uquiet -pquiet-demo -e 'SELECT 1' quiet"]
      interval: 4s
      timeout: 4s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-quiet-mediation}-redis
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 4s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-quiet-mediation}-backend
    environment: &env
      DATABASE_URL: mysql+pymysql://quiet:quiet-demo@db:3306/quiet
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-quiet-demo-replace-me}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports: ["${BACKEND_PORT:-19239}:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 4s
      timeout: 3s
      retries: 30
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-quiet-mediation}-worker
    command: ["python", "-m", "src.worker"]
    environment: *env
    volumes: ["artifacts:/artifacts"]
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time;assert time.time()-os.stat('/tmp/worker-heartbeat').st_mtime<20"]
      interval: 4s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-quiet-mediation}-frontend
    ports: ["${FRONTEND_PORT:-18239}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 4s
      timeout: 3s
      retries: 30
volumes:
  db_data:
  redis_data:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.221.40.0/24}
